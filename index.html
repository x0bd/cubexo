<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/cubexo-icon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CubeXO</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			@font-face {
				font-family: "Geist Mono";
				src: url("https://cdn.jsdelivr.net/npm/geist-mono@latest/dist/fonts/geist-mono-regular.woff2")
					format("woff2");
				font-weight: 400;
				font-style: normal;
				font-display: swap;
			}
			@font-face {
				font-family: "Geist Mono";
				src: url("https://cdn.jsdelivr.net/npm/geist-mono@latest/dist/fonts/geist-mono-medium.woff2")
					format("woff2");
				font-weight: 500;
				font-style: normal;
				font-display: swap;
			}
			.geist-mono {
				font-family: "Geist Mono", monospace;
			}
			.jp {
				font-family: "Noto Sans JP", sans-serif;
				letter-spacing: 0.03em;
			}
			/* Dock reflection effect */
			.dock-icon::after {
				content: "";
				position: absolute;
				bottom: -8px;
				left: 0;
				right: 0;
				height: 8px;
				background: linear-gradient(
					to bottom,
					currentColor,
					transparent
				);
				opacity: 0.15;
				filter: blur(2px);
				transform: scaleY(0.3);
				transform-origin: top;
				transition: all 0.2s;
			}
			.dock-icon:hover::after {
				opacity: 0.25;
				transform: scaleY(0.4);
			}
			.light-mode .dock-icon::after {
				opacity: 0.1;
			}
			.light-mode .dock-icon:hover::after {
				opacity: 0.15;
			}
			/* Active mode indicator */
			.dock-icon.active::before {
				content: "";
				position: absolute;
				bottom: -16px;
				left: 50%;
				width: 4px;
				height: 4px;
				background-color: currentColor;
				border-radius: 50%;
				transform: translateX(-50%);
			}
			.light-mode .dock-icon.active::before {
				background-color: rgba(15, 23, 42, 0.9);
				width: 5px;
				height: 5px;
			}
			/* Scrollbar styling */
			.custom-scrollbar::-webkit-scrollbar {
				width: 4px;
			}
			.custom-scrollbar::-webkit-scrollbar-track {
				background: transparent;
			}
			.custom-scrollbar::-webkit-scrollbar-thumb {
				background: rgba(161, 161, 170, 0.3);
				border-radius: 4px;
			}
			.custom-scrollbar::-webkit-scrollbar-thumb:hover {
				background: rgba(161, 161, 170, 0.5);
			}
			/* Vercel-inspired glass effect */
			.glass-panel {
				backdrop-filter: blur(12px);
				border: 1px solid rgba(63, 63, 70, 0.4);
				box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.2);
				transition: all 0.2s ease;
			}
			.glass-panel:hover {
				border-color: rgba(113, 113, 122, 0.5);
			}
			/* TRAF-inspired button styles */
			.traf-button {
				transition: all 0.2s cubic-bezier(0.23, 1, 0.32, 1);
			}
			.traf-button:hover {
				transform: translateY(-2px);
				box-shadow: 0 5px 10px rgba(0, 0, 0, 0.1);
			}
			.traf-button:active {
				transform: translateY(0);
			}
			/* Theme-specific styles - shadcn UI inspired */
			/* Light mode panel styles */
			.light-mode .panel {
				background-color: rgba(255, 255, 255, 0.98) !important; /* shadcn white */
				border: 1px solid rgba(226, 232, 240, 1) !important; /* shadcn border */
				box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03), 0 1px 6px -1px rgba(0, 0, 0, 0.02) !important; /* shadcn subtle shadow */
				backdrop-filter: blur(8px) !important;
			}
			.light-mode .panel-header,
			.light-mode .panel-footer {
				border-color: rgba(226, 232, 240, 1) !important; /* shadcn border */
				background-color: rgba(250, 250, 250, 0.6) !important; /* shadcn subtle background */
			}
			/* Light mode dock styles */
			.light-mode .dock {
				background-color: rgba(255, 255, 255, 0.9) !important;
				border: 1px solid rgba(226, 232, 240, 1) !important;
				box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03) !important;
				backdrop-filter: blur(10px) !important;
			}
			/* Light mode text and icon colors */
			.light-mode .dock-icon {
				color: rgba(15, 23, 42, 0.8) !important; /* shadcn text - slate-900 */
				background-color: transparent !important;
			}
			.light-mode .dock-icon:hover {
				color: rgba(15, 23, 42, 1) !important;
				background-color: rgba(248, 250, 252, 0.8) !important; /* slate-50 */
			}
			.light-mode .panel button,
			.light-mode .panel-header span,
			.light-mode .panel-content {
				color: rgba(17, 24, 39, 0.9) !important; /* shadcn text */
			}
			.light-mode .panel-header h3,
			.light-mode .panel-header h4 {
				color: rgba(17, 24, 39, 1) !important; /* shadcn heading */
				font-weight: 500 !important;
			}
			/* Light mode button hover states */
			.light-mode .panel button:hover {
				background-color: rgba(243, 244, 246, 1) !important; /* shadcn hover */
			}
			/* Light mode model buttons */
			.light-mode .model-button {
				background-color: rgba(249, 250, 251, 1) !important; /* shadcn background */
				border-color: rgba(229, 231, 235, 1) !important; /* shadcn border */
				color: rgba(17, 24, 39, 0.9) !important; /* shadcn text */
			}
			.light-mode .model-button:hover {
				background-color: rgba(243, 244, 246, 1) !important; /* shadcn hover */
				border-color: rgba(209, 213, 219, 1) !important; /* shadcn border hover */
			}
			.light-mode .model-button.active {
				background-color: rgba(239, 246, 255, 1) !important; /* shadcn blue light */
				border-color: rgba(59, 130, 246, 0.5) !important; /* shadcn blue */
				color: rgba(37, 99, 235, 1) !important; /* shadcn blue dark */
			}
			/* Light mode inputs and selects */
			.light-mode input,
			.light-mode select {
				background-color: rgba(255, 255, 255, 1) !important;
				border-color: rgba(229, 231, 235, 1) !important;
				color: rgba(17, 24, 39, 1) !important;
			}
			.light-mode input:focus,
			.light-mode select:focus {
				border-color: rgba(59, 130, 246, 0.5) !important;
				box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1) !important;
			}
			/* Theme toggle icon visibility */
			.light-mode #theme-toggle .lucide-sun-moon {
				opacity: 1 !important;
				transform: scale(1) !important;
			}
			.light-mode #theme-toggle .lucide-moon-star {
				opacity: 0 !important;
				transform: scale(0.5) !important;
			}
			.dark-mode #theme-toggle .lucide-sun-moon {
				opacity: 0 !important;
				transform: scale(0.5) !important;
			}
			.dark-mode #theme-toggle .lucide-moon-star {
				opacity: 1 !important;
				transform: scale(1) !important;
			}
			/* Fallback for when body classes aren't applied yet */
			html.dark #theme-toggle .lucide-sun-moon {
				opacity: 0 !important;
			}
			html.dark #theme-toggle .lucide-moon-star {
				opacity: 1 !important;
			}
			html:not(.dark) #theme-toggle .lucide-sun-moon {
				opacity: 1 !important;
			}
			html:not(.dark) #theme-toggle .lucide-moon-star {
				opacity: 0 !important;
			}
		</style>
	</head>
	<body
		class="bg-zinc-100 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 h-screen overflow-hidden font-sans antialiased transition-colors duration-300"
	>
		<!-- Canvas for Three.js rendering -->
		<canvas id="webgl" class="fixed inset-0 w-full h-full z-0"></canvas>

		<!-- Main UI container -->
		<div id="app" class="fixed inset-0 z-10 pointer-events-none">
			<!-- Logo in top left -->
			<div
				class="fixed top-6 left-6 flex items-center gap-3 pointer-events-auto"
			>
				<div
					class="w-10 h-10 rounded-xl glass-panel bg-zinc-900/80 dark:bg-zinc-900/50 border-zinc-800/60 dark:border-zinc-700/40 flex items-center justify-center text-xl shadow-lg"
				>
					<span class="text-zinc-50">▧</span>
				</div>
				<div class="flex flex-col">
					<h1
						class="text-lg font-bold tracking-tight text-zinc-900 dark:text-zinc-50 jp"
					>
						CubeXO
					</h1>
					<div
						class="text-[10px] geist-mono font-medium text-zinc-500 dark:text-zinc-400 tracking-wide"
					>
						ボクセル・エクスプローラー
					</div>
				</div>
			</div>

			<!-- macOS-style Dock -->
			<div
				class="fixed bottom-6 left-1/2 -translate-x-1/2 flex items-end gap-3 p-3 rounded-2xl glass-panel bg-zinc-900/60 dark:bg-zinc-900/50 border-zinc-800/50 dark:border-zinc-700/40 shadow-xl z-50 pointer-events-auto"
			>
				<!-- Normal Mode -->
				<button
					id="mode-normal"
					class="dock-icon w-12 h-12 flex items-center justify-center text-zinc-200 dark:text-zinc-300 transition-all duration-300 hover:scale-110 hover:-translate-y-1 relative traf-button active"
					aria-label="Normal Convert Mode"
				>
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="22"
						height="22"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="1.75"
						stroke-linecap="round"
						stroke-linejoin="round"
						class="lucide lucide-boxes"
					>
						<path d="M7 21h10" />
						<path d="M12 21v-6" />
						<path d="m7.9 16.5-2.9-3" />
						<path d="m19 13.5-2.9 3" />
						<path d="M12 3 4 11h16l-8-8Z" />
					</svg>
				</button>

				<!-- Voxel Edit Mode -->
				<button
					id="mode-edit"
					class="dock-icon w-12 h-12 flex items-center justify-center text-zinc-200 dark:text-zinc-300 transition-all duration-300 hover:scale-110 hover:-translate-y-1 relative traf-button"
					aria-label="Voxel Edit Mode"
				>
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="22"
						height="22"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="1.75"
						stroke-linecap="round"
						stroke-linejoin="round"
						class="lucide lucide-pencil-ruler"
					>
						<path d="m15 5 4 4" />
						<path
							d="M13 7 8.7 2.7a2.41 2.41 0 0 0-3.4 0L2.7 5.3a2.41 2.41 0 0 0 0 3.4L7 13"
						/>
						<path d="m8 6 2-2" />
						<path
							d="m2 22 5.5-1.5L21.17 6.83a2.82 2.82 0 0 0-4-4L3.5 16.5Z"
						/>
						<path d="m18 16 2-2" />
						<path
							d="m17 11 4.3 4.3c.94.94.94 2.46 0 3.4l-2.6 2.6c-.94.94-2.46.94-3.4 0L11 17"
						/>
					</svg>
				</button>

				<!-- Fun/Magic Mode -->
				<button
					id="mode-fun"
					class="dock-icon w-12 h-12 flex items-center justify-center text-zinc-200 dark:text-zinc-300 transition-all duration-300 hover:scale-110 hover:-translate-y-1 relative traf-button"
					aria-label="Fun/Magic Mode"
				>
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="22"
						height="22"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="1.75"
						stroke-linecap="round"
						stroke-linejoin="round"
						class="lucide lucide-sparkles"
					>
						<path d="M12 3v4" />
						<path d="M12 17v4" />
						<path
							d="M12 10a2 2 0 0 0-2 2 2 2 0 0 0 4 0 2 2 0 0 0-2-2Z"
						/>
						<path d="m14.5 7.5-5 5" />
						<path d="m16.5 11.5-7 7" />
						<path
							d="M19 5.5 18.5 7 17 7.5 18.5 8 19 9.5 19.5 8 21 7.5 19.5 7 19 5.5Z"
						/>
						<path d="m7 14.5-5 5" />
						<path
							d="M7 5.5 6.5 7 5 7.5 6.5 8 7 9.5 7.5 8 9 7.5 7.5 7 7 5.5Z"
						/>
						<path
							d="M19 14.5 18.5 16l-1.5.5 1.5.5.5 1.5.5-1.5 1.5-.5-1.5-.5-.5-1.5Z"
						/>
					</svg>
				</button>

				<!-- Divider -->
				<div
					class="h-10 w-px bg-zinc-600/20 dark:bg-zinc-600/30 mx-1"
				></div>

				<!-- Theme Toggle -->
				<button
					id="theme-toggle"
					class="dock-icon w-12 h-12 flex items-center justify-center text-zinc-700 dark:text-zinc-300 transition-all duration-300 hover:scale-110 hover:-translate-y-1 relative traf-button"
					aria-label="Toggle Theme"
				>
					<!-- Sun icon for light mode -->
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="22"
						height="22"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="1.75"
						stroke-linecap="round"
						stroke-linejoin="round"
						class="lucide lucide-sun-moon absolute transition-all duration-300"
					>
						<circle cx="12" cy="12" r="4" />
						<path d="M12 2v2" />
						<path d="M12 20v2" />
						<path d="m4.93 4.93 1.41 1.41" />
						<path d="m17.66 17.66 1.41 1.41" />
						<path d="M2 12h2" />
						<path d="M20 12h2" />
						<path d="m6.34 17.66-1.41 1.41" />
						<path d="m19.07 4.93-1.41 1.41" />
					</svg>
					<!-- Moon icon for dark mode -->
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="22"
						height="22"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="1.75"
						stroke-linecap="round"
						stroke-linejoin="round"
						class="lucide lucide-moon-star absolute transition-all duration-300"
					>
						<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
						<path d="M19 3v4" />
						<path d="M21 5h-4" />
					</svg>
				</button>
			</div>

			<!-- Right Panel Container -->
			<div
				class="fixed top-6 right-6 bottom-6 w-[280px] flex flex-col gap-3 pointer-events-auto"
			>
				<!-- Models Panel -->
				<div
					class="panel max-h-[60vh] rounded-xl glass-panel bg-zinc-800/80 dark:bg-zinc-900/80 border-zinc-700/50 dark:border-zinc-700/50 shadow-xl flex flex-col overflow-hidden"
				>
					<div
						class="panel-header flex items-center justify-between px-4 py-3 border-b border-zinc-700/50 dark:border-zinc-700/50"
					>
						<div class="flex items-center gap-2">
							<span class="text-zinc-300 dark:text-zinc-300">
								<svg
									xmlns="http://www.w3.org/2000/svg"
									width="18"
									height="18"
									viewBox="0 0 24 24"
									fill="none"
									stroke="currentColor"
									stroke-width="1.75"
									stroke-linecap="round"
									stroke-linejoin="round"
									class="lucide lucide-cube"
								>
									<path d="m21 7.5-9-5.25L3 7.5" />
									<path d="M3 7.5v9l9 5.25 9-5.25v-9" />
									<path d="M3.3 7.5 12 12l8.7-4.5" />
									<path d="M12 12v9.75" />
								</svg>
							</span>
							<span class="text-sm font-medium jp text-zinc-200 dark:text-zinc-200"
								>MODELS</span
							>
						</div>
						<div class="control-group flex gap-1">
							<button
								id="export-png"
								aria-label="Export as PNG"
								class="w-7 h-7 flex items-center justify-center rounded-md bg-zinc-700/90 dark:bg-zinc-800/90 border border-zinc-600/70 dark:border-zinc-700/70 hover:bg-zinc-600/90 dark:hover:bg-zinc-700/90 text-zinc-200 dark:text-zinc-200 transition-all traf-button"
							>
								<svg
									xmlns="http://www.w3.org/2000/svg"
									width="14"
									height="14"
									viewBox="0 0 24 24"
									fill="none"
									stroke="currentColor"
									stroke-width="1.75"
									stroke-linecap="round"
									stroke-linejoin="round"
									class="lucide lucide-image"
								>
									<rect
										width="18"
										height="18"
										x="3"
										y="3"
										rx="2"
									/>
									<circle cx="9" cy="9" r="2" />
									<path
										d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"
									/>
								</svg>
							</button>
							<button
								id="export-model"
								aria-label="Export model as GLB"
								class="w-7 h-7 flex items-center justify-center rounded-md bg-zinc-700/90 dark:bg-zinc-800/90 border border-zinc-600/70 dark:border-zinc-700/70 hover:bg-zinc-600/90 dark:hover:bg-zinc-700/90 text-zinc-200 dark:text-zinc-200 transition-all traf-button"
							>
								<svg
									xmlns="http://www.w3.org/2000/svg"
									width="14"
									height="14"
									viewBox="0 0 24 24"
									fill="none"
									stroke="currentColor"
									stroke-width="1.75"
									stroke-linecap="round"
									stroke-linejoin="round"
									class="lucide lucide-download"
								>
									<path
										d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
									/>
									<polyline points="7 10 12 15 17 10" />
									<line x1="12" y1="15" x2="12" y2="3" />
								</svg>
							</button>
						</div>
					</div>

					<div
						id="selector"
						class="flex flex-wrap gap-2 p-3 overflow-y-auto custom-scrollbar"
					></div>

					<div
						class="panel-footer px-4 py-3 border-t border-zinc-700/50 dark:border-zinc-700/50"
					>
						<label
							id="upload-model-btn"
							class="w-full flex items-center justify-between py-1.5 px-3 rounded-md bg-indigo-600/90 hover:bg-indigo-500/90 text-white border border-indigo-500/40 transition-all cursor-pointer traf-button"
							aria-label="Upload your own model"
						>
							<span class="text-xs jp tracking-wide"
								>UPLOAD MODEL</span
							>
							<input
								type="file"
								id="model-upload"
								accept=".glb"
								hidden
							/>
							<svg
								xmlns="http://www.w3.org/2000/svg"
								width="14"
								height="14"
								viewBox="0 0 24 24"
								fill="none"
								stroke="currentColor"
								stroke-width="1.75"
								stroke-linecap="round"
								stroke-linejoin="round"
								class="lucide lucide-upload"
							>
								<path
									d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
								/>
								<polyline points="17 8 12 3 7 8" />
								<line x1="12" y1="3" x2="12" y2="15" />
							</svg>
						</label>
					</div>
				</div>

				<!-- Properties Panel -->
				<div
					class="panel rounded-xl glass-panel bg-zinc-800/80 dark:bg-zinc-900/80 border-zinc-700/50 dark:border-zinc-700/50 shadow-xl flex flex-col"
				>
					<div
						class="panel-header flex items-center justify-between px-4 py-3 border-b border-zinc-700/50 dark:border-zinc-700/50"
					>
						<div class="flex items-center gap-2">
							<span class="text-zinc-300 dark:text-zinc-300">
								<svg
									xmlns="http://www.w3.org/2000/svg"
									width="18"
									height="18"
									viewBox="0 0 24 24"
									fill="none"
									stroke="currentColor"
									stroke-width="1.75"
									stroke-linecap="round"
									stroke-linejoin="round"
									class="lucide lucide-settings-2"
								>
									<path d="M20 7h-9" />
									<path d="M14 17H5" />
									<circle cx="17" cy="17" r="3" />
									<circle cx="7" cy="7" r="3" />
								</svg>
							</span>
							<span class="text-sm font-medium jp text-zinc-200 dark:text-zinc-200"
								>PROPERTIES</span
							>
						</div>
					</div>

					<div class="panel-content px-3.5 py-3.5 space-y-4.5">
						<div class="property-group">
							<div
								class="flex items-center justify-between mb-1.5"
							>
								<div
									class="text-xs jp text-zinc-300 dark:text-zinc-300 tracking-wide"
								>
									RESOLUTION
								</div>
								<span class="text-xs geist-mono text-zinc-300 dark:text-zinc-300"
									>16</span
								>
							</div>
							<div class="flex items-center gap-2.5">

										stroke-linejoin="round"
