<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CubeXO</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<!-- Fallback to Vercel's CDN for Geist Mono -->
		<link
			rel="stylesheet"
			href="https://vercel.com/font/geist-mono/style.css"
		/>
	</head>
	<body>
		<canvas id="webgl"></canvas>
		<div id="ui-container">
			<header id="header">
				<h1>CubeXO</h1>
				<div class="subtitle">Voxel Explorer</div>
				<div class="button-container">
					<button id="theme-toggle" aria-label="Toggle theme">
						<svg
							id="moon-icon"
							xmlns="http://www.w3.org/2000/svg"
							width="20"
							height="20"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<path
								d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
							></path>
						</svg>
						<svg
							id="sun-icon"
							xmlns="http://www.w3.org/2000/svg"
							width="20"
							height="20"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<circle cx="12" cy="12" r="5"></circle>
							<line x1="12" y1="1" x2="12" y2="3"></line>
							<line x1="12" y1="21" x2="12" y2="23"></line>
							<line
								x1="4.22"
								y1="4.22"
								x2="5.64"
								y2="5.64"
							></line>
							<line
								x1="18.36"
								y1="18.36"
								x2="19.78"
								y2="19.78"
							></line>
							<line x1="1" y1="12" x2="3" y2="12"></line>
							<line x1="21" y1="12" x2="23" y2="12"></line>
							<line
								x1="4.22"
								y1="19.78"
								x2="5.64"
								y2="18.36"
							></line>
							<line
								x1="18.36"
								y1="5.64"
								x2="19.78"
								y2="4.22"
							></line>
						</svg>
					</button>
				</div>
			</header>
			<div id="selector"></div>
			<div id="loader">Loading models...</div>

			<div class="export-buttons">
				<button id="export-png" aria-label="Export as PNG">
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="20"
						height="20"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<path
							d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
						></path>
						<circle cx="12" cy="13" r="4"></circle>
					</svg>
					<span>PNG</span>
				</button>
				<button id="export-model" aria-label="Export model as GLB">
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="20"
						height="20"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<path
							d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
						></path>
						<polyline points="7 10 12 15 17 10"></polyline>
						<line x1="12" y1="15" x2="12" y2="3"></line>
					</svg>
					<span>GLB</span>
				</button>
			</div>
		</div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
