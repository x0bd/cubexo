<!DOCTYPE html>
<html lang="en" class="light">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/vite.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="color-scheme" content="light dark" />
		<title>CubeXO</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<!-- Fallback to Vercel's CDN for Geist Mono -->
		<link
			rel="stylesheet"
			href="https://vercel.com/font/geist-mono/style.css"
		/>
	</head>
	<body
		class="bg-black dark:bg-black overflow-hidden m-0 p-0 font-mono text-white"
	>
		<canvas
			id="webgl"
			class="fixed top-0 left-0 w-full h-full z-0"
		></canvas>

		<div
			id="ui-container"
			class="w-full h-full fixed top-0 left-0 z-10 pointer-events-none"
		>
			<header id="header" class="p-6">
				<h1 class="text-4xl font-bold mb-1">CubeXO</h1>
				<div class="text-sm opacity-70">Voxel Explorer</div>
				<div class="button-container absolute top-6 right-6">
					<button
						id="theme-toggle"
						aria-label="Toggle theme"
						class="fixed w-10 h-10 rounded-full bg-white/10 border border-white/20 text-white z-20 flex items-center justify-center hover:bg-white/20 transition-colors"
					>
						<svg
							id="moon-icon"
							xmlns="http://www.w3.org/2000/svg"
							width="20"
							height="20"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							class="hidden dark:block"
						>
							<path
								d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
							></path>
						</svg>
						<svg
							id="sun-icon"
							xmlns="http://www.w3.org/2000/svg"
							width="20"
							height="20"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="2"
							stroke-linecap="round"
							stroke-linejoin="round"
							class="block dark:hidden"
						>
							<circle cx="12" cy="12" r="5"></circle>
							<line x1="12" y1="1" x2="12" y2="3"></line>
							<line x1="12" y1="21" x2="12" y2="23"></line>
							<line
								x1="4.22"
								y1="4.22"
								x2="5.64"
								y2="5.64"
							></line>
							<line
								x1="18.36"
								y1="18.36"
								x2="19.78"
								y2="19.78"
							></line>
							<line x1="1" y1="12" x2="3" y2="12"></line>
							<line x1="21" y1="12" x2="23" y2="12"></line>
							<line
								x1="4.22"
								y1="19.78"
								x2="5.64"
								y2="18.36"
							></line>
							<line
								x1="18.36"
								y1="5.64"
								x2="19.78"
								y2="4.22"
							></line>
						</svg>
					</button>
				</div>
			</header>

			<div
				id="selector"
				class="fixed bottom-6 left-1/2 -translate-x-1/2 flex gap-4 p-4 overflow-x-auto max-w-full z-10 justify-center pointer-events-auto"
			></div>
			<div
				id="loader"
				class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-white/80 z-50"
			>
				Loading models...
			</div>

			<div
				class="export-buttons fixed bottom-6 right-6 flex flex-col items-end gap-3 z-20 pointer-events-auto"
			>
				<div
					class="export-hint bg-white/10 px-3 py-2 rounded text-xs text-white/70 border border-white/20"
				>
					Position model by dragging, then export a zoomed-in
					high-resolution image or 3D model
				</div>
				<div class="flex gap-3">
					<button
						id="export-png"
						aria-label="Export as PNG"
						class="h-9 px-3 rounded flex items-center gap-1.5 bg-white text-black hover:translate-y-[-2px] hover:shadow-lg active:translate-y-0 active:shadow-md transition-all"
					>
						<svg
							xmlns="http://www.w3.org/2000/svg"
							width="16"
							height="16"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="1.75"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<path
								d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
							></path>
							<circle cx="12" cy="13" r="4"></circle>
						</svg>
						<span class="relative top-[1px]">PNG</span>
					</button>
					<button
						id="export-model"
						aria-label="Export model as GLB"
						class="h-9 px-3 rounded flex items-center gap-1.5 bg-white text-black hover:translate-y-[-2px] hover:shadow-lg active:translate-y-0 active:shadow-md transition-all"
					>
						<svg
							xmlns="http://www.w3.org/2000/svg"
							width="16"
							height="16"
							viewBox="0 0 24 24"
							fill="none"
							stroke="currentColor"
							stroke-width="1.75"
							stroke-linecap="round"
							stroke-linejoin="round"
						>
							<path
								d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
							></path>
							<polyline points="7 10 12 15 17 10"></polyline>
							<line x1="12" y1="15" x2="12" y2="3"></line>
						</svg>
						<span class="relative top-[1px]">GLB</span>
					</button>
				</div>

				<label
					id="upload-model-btn"
					class="h-9 px-3 rounded flex items-center gap-1.5 bg-white/10 border border-white/20 text-white hover:bg-white/20 hover:translate-y-[-2px] hover:shadow-lg active:translate-y-0 active:shadow-md transition-all cursor-pointer"
					aria-label="Upload your own model"
				>
					<input
						type="file"
						id="model-upload"
						accept=".glb"
						class="hidden"
					/>
					<svg
						xmlns="http://www.w3.org/2000/svg"
						width="16"
						height="16"
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="1.75"
						stroke-linecap="round"
						stroke-linejoin="round"
					>
						<path
							d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
						></path>
						<polyline points="17 8 12 3 7 8"></polyline>
						<line x1="12" y1="3" x2="12" y2="15"></line>
					</svg>
					<span class="relative top-[1px]">Upload GLB</span>
				</label>
			</div>
		</div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
