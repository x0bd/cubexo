<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/cubexo-icon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>CubeXO</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<!-- Canvas for Three.js rendering -->
		<canvas id="webgl"></canvas>

		<!-- Main UI container -->
		<div id="app">
			<!-- Header -->
			<header>
				<div class="brand">
					<h1>CubeXO</h1>
					<div class="pill">Voxel Explorer</div>
				</div>

				<div class="toolbar">
					<button id="theme-toggle" aria-label="Toggle theme">
						<svg
							id="moon-icon"
							viewBox="0 0 24 24"
							width="16"
							height="16"
						>
							<path
								d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"
							></path>
						</svg>
						<svg
							id="sun-icon"
							viewBox="0 0 24 24"
							width="16"
							height="16"
						>
							<circle cx="12" cy="12" r="5"></circle>
							<line x1="12" y1="1" x2="12" y2="3"></line>
							<line x1="12" y1="21" x2="12" y2="23"></line>
							<line
								x1="4.22"
								y1="4.22"
								x2="5.64"
								y2="5.64"
							></line>
							<line
								x1="18.36"
								y1="18.36"
								x2="19.78"
								y2="19.78"
							></line>
							<line x1="1" y1="12" x2="3" y2="12"></line>
							<line x1="21" y1="12" x2="23" y2="12"></line>
							<line
								x1="4.22"
								y1="19.78"
								x2="5.64"
								y2="18.36"
							></line>
							<line
								x1="18.36"
								y1="5.64"
								x2="19.78"
								y2="4.22"
							></line>
						</svg>
					</button>
				</div>
			</header>

			<!-- Model Selector -->
			<div id="selector" class="model-selector"></div>

			<!-- Loading indicator -->
			<div id="loader">
				<svg class="spinner" viewBox="0 0 50 50" width="20" height="20">
					<circle
						cx="25"
						cy="25"
						r="20"
						fill="none"
						stroke="currentColor"
						stroke-width="4"
					></circle>
				</svg>
				<span>Loading models</span>
			</div>

			<!-- Model controls -->
			<div class="control-panel">
				<div class="control-group">
					<button
						id="export-png"
						class="btn btn-secondary"
						aria-label="Export as PNG"
					>
						<svg viewBox="0 0 24 24" width="16" height="16">
							<path
								d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
							></path>
							<circle cx="12" cy="13" r="4"></circle>
						</svg>
						<span>PNG</span>
					</button>

					<button
						id="export-model"
						class="btn btn-primary"
						aria-label="Export model as GLB"
					>
						<svg viewBox="0 0 24 24" width="16" height="16">
							<path
								d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
							></path>
							<polyline points="7 10 12 15 17 10"></polyline>
							<line x1="12" y1="15" x2="12" y2="3"></line>
						</svg>
						<span>GLB</span>
					</button>
				</div>

				<label
					id="upload-model-btn"
					class="btn btn-outline"
					aria-label="Upload your own model"
				>
					<input type="file" id="model-upload" accept=".glb" hidden />
					<svg viewBox="0 0 24 24" width="16" height="16">
						<path
							d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"
						></path>
						<polyline points="17 8 12 3 7 8"></polyline>
						<line x1="12" y1="3" x2="12" y2="15"></line>
					</svg>
					<span>Upload Model</span>
				</label>
			</div>
		</div>

		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
