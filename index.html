<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/cubexo-icon.svg" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
		/>
		<title>CubeXO</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@100..900&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
		<style>
			/* ============================================================
			   DESIGN TOKENS
			   ============================================================ */
			:root {
				--font-geist-mono: "Geist Mono", monospace;
				--font-inter: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

				--bg-app:           #090909;
				--bg-panel:         #0f0f0f;
				--bg-panel-header:  #0c0c0c;
				--bg-item-hover:    #141414;
				--bg-item-active:   #191919;
				--bg-btn:           #141414;
				--bg-btn-hover:     #1c1c1c;
				--bg-btn-primary:   #1e1e1e;

				--border:           #1d1d1d;
				--border-subtle:    #161616;

				--text-primary:     #cccccc;
				--text-secondary:   #6a6a6a;
				--text-muted:       #3f3f3f;
				--text-badge:       #555555;

				--radius-sm:  3px;
				--radius:     4px;
				--radius-lg:  6px;
			}

			/* ============================================================
			   BASE RESET
			   ============================================================ */
			*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

			html, body {
				width: 100%; height: 100%;
				overflow: hidden;
				background: var(--bg-app);
				color: var(--text-primary);
				font-family: var(--font-inter);
				font-size: 12px;
				-webkit-font-smoothing: antialiased;
				-webkit-tap-highlight-color: transparent;
			}

			button { cursor: pointer; font-family: inherit; }
			input, select, textarea { font-family: inherit; }

			/* ============================================================
			   SCROLLBAR
			   ============================================================ */
			::-webkit-scrollbar { width: 4px; height: 4px; }
			::-webkit-scrollbar-track { background: transparent; }
			::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }
			::-webkit-scrollbar-thumb:hover { background: #2e2e2e; }

			/* ============================================================
			   PANEL PRIMITIVES
			   ============================================================ */
			.s-panel-header {
				height: 34px;
				display: flex;
				align-items: center;
				gap: 6px;
				padding: 0 10px;
				border-bottom: 1px solid var(--border);
				background: var(--bg-panel-header);
				flex-shrink: 0;
				user-select: none;
			}

			.s-drag-handle {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 2.5px;
				width: 9px;
				opacity: 0.22;
				cursor: grab;
				flex-shrink: 0;
			}
			.s-drag-handle i {
				display: block;
				width: 2px;
				height: 2px;
				background: var(--text-primary);
				border-radius: 50%;
			}

			.s-panel-title {
				font-size: 10px;
				font-weight: 600;
				letter-spacing: 0.07em;
				color: var(--text-muted);
				text-transform: uppercase;
				flex: 1;
			}

			/* ============================================================
			   ICON BUTTON
			   ============================================================ */
			.s-ico {
				width: 22px;
				height: 22px;
				display: flex;
				align-items: center;
				justify-content: center;
				border-radius: var(--radius-sm);
				color: var(--text-secondary);
				border: none;
				background: transparent;
				transition: background 0.1s, color 0.1s;
				flex-shrink: 0;
			}
			.s-ico:hover { background: var(--bg-item-hover); color: var(--text-primary); }
			.s-ico:active { background: var(--bg-item-active); }

			/* ============================================================
			   SECTION LABEL
			   ============================================================ */
			.s-section {
				font-size: 10px;
				font-weight: 600;
				letter-spacing: 0.07em;
				color: var(--text-muted);
				text-transform: uppercase;
				padding: 8px 10px 4px;
				flex-shrink: 0;
			}

			.s-divider {
				height: 1px;
				background: var(--border-subtle);
				margin: 2px 0;
				flex-shrink: 0;
			}

			/* ============================================================
			   LAYER ITEM (left panel)
			   ============================================================ */
			.s-layer {
				display: flex;
				align-items: center;
				height: 30px;
				padding: 0 6px;
				gap: 6px;
				border: none;
				background: transparent;
				color: var(--text-primary);
				width: 100%;
				text-align: left;
				transition: background 0.1s;
				cursor: pointer;
				position: relative;
			}
			.s-layer:hover { background: var(--bg-item-hover); }
			.s-layer:active { background: var(--bg-item-active); }

			.s-layer-grip {
				display: flex;
				flex-direction: column;
				gap: 2.5px;
				opacity: 0.18;
				flex-shrink: 0;
			}
			.s-layer-grip span {
				display: block;
				width: 9px;
				height: 1px;
				background: var(--text-primary);
				border-radius: 1px;
			}

			.s-layer-icon {
				width: 18px;
				height: 18px;
				display: flex;
				align-items: center;
				justify-content: center;
				border-radius: 3px;
				background: var(--bg-item-active);
				border: 1px solid var(--border);
				flex-shrink: 0;
				color: var(--text-secondary);
			}

			.s-layer-name {
				flex: 1;
				font-size: 12px;
				color: var(--text-primary);
				letter-spacing: -0.01em;
			}

			.s-layer-end {
				display: flex;
				gap: 1px;
				opacity: 0;
				transition: opacity 0.1s;
			}
			.s-layer:hover .s-layer-end { opacity: 1; }

			/* ============================================================
			   PROPERTY ROW (right panel)
			   ============================================================ */
			.s-prop {
				display: flex;
				align-items: center;
				justify-content: space-between;
				height: 27px;
				padding: 0 12px;
				gap: 8px;
				transition: background 0.1s;
			}
			.s-prop:hover { background: var(--bg-item-hover); }

			.s-prop-label {
				font-size: 11px;
				color: var(--text-secondary);
				flex-shrink: 0;
			}
			.s-prop-value {
				font-size: 11px;
				color: var(--text-primary);
				text-align: right;
			}

			/* ============================================================
			   PROP TITLE AREA
			   ============================================================ */
			.s-prop-title {
				display: flex;
				align-items: center;
				justify-content: space-between;
				padding: 10px 12px 9px;
				flex-shrink: 0;
			}
			.s-prop-title-text {
				font-size: 13px;
				font-weight: 500;
				color: var(--text-primary);
				letter-spacing: -0.01em;
			}
			.s-badge {
				font-size: 10px;
				letter-spacing: 0.04em;
				padding: 2px 7px;
				border-radius: var(--radius-sm);
				background: var(--bg-item-active);
				border: 1px solid var(--border);
				color: var(--text-badge);
				font-weight: 500;
			}

			/* ============================================================
			   BUTTONS
			   ============================================================ */
			.s-btn {
				display: flex;
				align-items: center;
				gap: 6px;
				padding: 6px 9px;
				border-radius: var(--radius);
				background: var(--bg-btn);
				border: 1px solid var(--border);
				color: var(--text-secondary);
				font-size: 11px;
				cursor: pointer;
				transition: background 0.1s, color 0.1s, border-color 0.1s;
				letter-spacing: -0.01em;
			}
			.s-btn:hover {
				background: var(--bg-btn-hover);
				color: var(--text-primary);
				border-color: #262626;
			}
			.s-btn:active {
				background: var(--bg-item-active);
				transform: scale(0.98);
			}

			.s-btn-grid {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 4px;
				padding: 4px 10px 8px;
			}

			.s-actions {
				display: flex;
				gap: 4px;
				padding: 4px 10px 10px;
			}
			.s-actions .s-btn {
				flex: 1;
				justify-content: center;
			}

			/* Upload button special style */
			.s-upload-btn {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 6px;
				width: 100%;
				padding: 7px 10px;
				border-radius: var(--radius);
				background: var(--bg-btn);
				border: 1px solid var(--border);
				color: var(--text-secondary);
				font-size: 11px;
				cursor: pointer;
				transition: background 0.12s, color 0.12s, border-color 0.12s;
				letter-spacing: -0.01em;
			}
			.s-upload-btn:hover {
				background: var(--bg-btn-hover);
				color: var(--text-primary);
				border-color: #262626;
			}
			.s-upload-btn:active {
				background: var(--bg-item-active);
			}

			/* ============================================================
			   TOP BAR
			   ============================================================ */
			.s-top-bar {
				height: 34px;
				display: flex;
				align-items: center;
				padding: 0 12px;
				gap: 8px;
				border-bottom: 1px solid var(--border);
				background: var(--bg-panel-header);
				flex-shrink: 0;
			}

			.s-logo {
				font-family: var(--font-geist-mono);
				font-size: 11px;
				font-weight: 700;
				color: var(--text-primary);
				letter-spacing: -0.02em;
				display: flex;
				align-items: center;
				gap: 6px;
				user-select: none;
			}
			.s-logo-icon {
				width: 18px;
				height: 18px;
				display: flex;
				align-items: center;
				justify-content: center;
				border-radius: 4px;
				background: var(--bg-item-active);
				border: 1px solid var(--border);
				color: var(--text-secondary);
				font-size: 10px;
			}

			.s-top-divider {
				width: 1px;
				height: 14px;
				background: var(--border);
				flex-shrink: 0;
			}

			.s-top-controls {
				display: flex;
				align-items: center;
				gap: 1px;
			}

			/* ============================================================
			   BOTTOM BAR
			   ============================================================ */
			.s-bottom-bar {
				height: 34px;
				display: flex;
				align-items: center;
				padding: 0 12px;
				gap: 8px;
				border-top: 1px solid var(--border);
				background: var(--bg-panel-header);
				flex-shrink: 0;
			}

			.s-bottom-info {
				font-size: 11px;
				color: var(--text-muted);
				letter-spacing: -0.01em;
				flex: 1;
			}

			.s-bottom-tag {
				font-size: 10px;
				font-weight: 500;
				letter-spacing: 0.05em;
				color: var(--text-muted);
				padding: 2px 7px;
				border-radius: 20px;
				border: 1px solid var(--border-subtle);
				background: transparent;
				cursor: default;
			}

			/* ============================================================
			   SIDE PANELS
			   ============================================================ */
			.s-left-panel {
				width: 220px;
				min-width: 220px;
				border-right: 1px solid var(--border);
				background: var(--bg-panel);
				display: flex;
				flex-direction: column;
				overflow: hidden;
				pointer-events: auto;
			}

			.s-right-panel {
				width: 260px;
				min-width: 260px;
				border-left: 1px solid var(--border);
				background: var(--bg-panel);
				display: flex;
				flex-direction: column;
				overflow: hidden;
				pointer-events: auto;
			}

			.s-panel-body {
				flex: 1;
				overflow-y: auto;
				overflow-x: hidden;
			}

			.s-panel-footer {
				border-top: 1px solid var(--border);
				padding: 8px 10px;
				flex-shrink: 0;
			}

			/* ============================================================
			   LOADER
			   ============================================================ */
			#loader {
				position: fixed;
				left: 50%;
				top: 50%;
				transform: translate(-50%, -50%);
				z-index: 100;
				background: var(--bg-panel);
				border: 1px solid var(--border);
				border-radius: var(--radius-lg);
				padding: 10px 16px;
				display: flex;
				align-items: center;
				gap: 10px;
				font-size: 10px;
				font-weight: 600;
				letter-spacing: 0.07em;
				color: var(--text-secondary);
				text-transform: uppercase;
				pointer-events: auto;
			}

			.s-spinner {
				width: 14px;
				height: 14px;
				border: 1.5px solid var(--border);
				border-top-color: var(--text-secondary);
				border-radius: 50%;
				animation: spin 0.8s linear infinite;
				flex-shrink: 0;
			}
			@keyframes spin { to { transform: rotate(360deg); } }

			/* ============================================================
			   NOTIFICATIONS (created by App.ts)
			   ============================================================ */
			@keyframes fadeInUp {
				from { opacity: 0; transform: translateY(8px) scale(0.97); }
				to   { opacity: 1; transform: translateY(0) scale(1); }
			}
			@keyframes fadeOutDown {
				from { opacity: 1; transform: translateY(0) scale(1); }
				to   { opacity: 0; transform: translateY(8px) scale(0.97); }
			}
			.animate-fade-in  { animation: fadeInUp  0.25s cubic-bezier(0.16,1,0.3,1) forwards; }
			.animate-fade-out { animation: fadeOutDown 0.2s cubic-bezier(0.16,1,0.3,1) forwards; }

			/* ============================================================
			   MOBILE — panels hide on small screens
			   ============================================================ */
			@media (max-width: 767px) {
				.s-left-panel { display: none; }
				.s-right-panel { display: none; }
				.s-right-panel.mobile-open { display: flex; position: fixed; top: 34px; right: 0; bottom: 34px; z-index: 60; }
				#mobile-panel-toggle { display: flex !important; }
			}

			/* ============================================================
			   FOCUS STYLES
			   ============================================================ */
			button:focus-visible,
			a:focus-visible { outline: 1.5px solid #444; outline-offset: 2px; }

			/* keep model-preview styles for App.ts dynamic usage */
			.model-preview {
				position: relative;
				width: 130px; height: 130px;
				aspect-ratio: 1;
				background: rgba(255,255,255,0.02);
				border: 1px solid rgba(255,255,255,0.04);
				border-radius: 6px;
				overflow: hidden;
				cursor: pointer;
			}
		</style>
	</head>
	<body class="dark-mode">

		<!-- ============================================================
		     THREE.JS CANVAS (full screen, behind everything)
		     ============================================================ -->
		<canvas id="webgl" style="position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block;"></canvas>

		<!-- ============================================================
		     MAIN APP WRAPPER
		     ============================================================ -->
		<div id="app" style="position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;pointer-events:none;">

			<!-- TOP BAR ------------------------------------------------ -->
			<div class="s-top-bar" style="pointer-events:auto;">
				<!-- Logo -->
				<div class="s-logo">
					<div class="s-logo-icon">
						<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
							<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
							<rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
						</svg>
					</div>
					CubeXO
				</div>

				<div class="s-top-divider"></div>

				<!-- Toolbar controls -->
				<div class="s-top-controls">
					<button class="s-ico" title="Undo">
						<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5v0a5.5 5.5 0 0 1-5.5 5.5H11"/></svg>
					</button>
					<button class="s-ico" title="Redo">
						<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5v0A5.5 5.5 0 0 0 9.5 20H13"/></svg>
					</button>
				</div>

				<div class="s-top-divider"></div>

				<div class="s-top-controls">
					<button class="s-ico" title="Zoom Out">
						<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
					</button>
					<span style="font-size:11px;color:var(--text-secondary);padding:0 4px;min-width:36px;text-align:center;cursor:default;user-select:none;">100%</span>
					<button class="s-ico" title="Zoom In">
						<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
					</button>
				</div>

				<!-- Spacer -->
				<div style="flex:1;"></div>

				<!-- Right side controls -->
				<div class="s-top-controls">
					<button id="theme-toggle" class="s-ico" title="Toggle theme">
						<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
					</button>
					<!-- Mobile panel toggle (hidden on desktop) -->
					<button id="mobile-panel-toggle" class="s-ico" title="Toggle panel" style="display:none;">
						<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
					</button>
				</div>
			</div>

			<!-- MIDDLE ROW (left panel + canvas + right panel) ---------- -->
			<div style="flex:1;display:flex;min-height:0;overflow:hidden;">

				<!-- LEFT PANEL: EFFECTS --------------------------------- -->
				<div class="s-left-panel">
					<!-- Header -->
					<div class="s-panel-header">
						<div class="s-drag-handle">
							<i></i><i></i><i></i><i></i><i></i><i></i>
						</div>
						<span class="s-panel-title">Effects</span>
						<button class="s-ico" title="Add">
							<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
						</button>
						<button class="s-ico" title="List view">
							<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
						</button>
					</div>

					<!-- Layer list -->
					<div class="s-panel-body">
						<!-- Shake -->
						<button id="effect-shake" class="s-layer" title="Shake effect">
							<div class="s-layer-grip"><span></span><span></span><span></span></div>
							<div class="s-layer-icon">
								<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25"><path d="m2 8 2 2-2 2 2 2-2 2"/><path d="m22 8-2 2 2 2-2 2 2 2"/><rect width="8" height="14" x="8" y="5" rx="1"/></svg>
							</div>
							<span class="s-layer-name">Shake</span>
							<div class="s-layer-end">
								<button class="s-ico" tabindex="-1" title="Visibility" onclick="event.stopPropagation()">
									<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
								</button>
							</div>
						</button>

						<!-- Explode -->
						<button id="effect-explode" class="s-layer" title="Explode effect">
							<div class="s-layer-grip"><span></span><span></span><span></span></div>
							<div class="s-layer-icon">
								<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>

		<!-- Export panel show button (panel is always visible on desktop) -->
		<button id="export-panel-show" style="display:none;" aria-hidden="true"></button>

		<!-- SCRIPTS ---------------------------------------------------- -->
		<script type="module" src="/src/main.ts"></script>
		<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

		<script>
			document.addEventListener("DOMContentLoaded", function () {
				const rightPanel = document.getElementById("right-panel-container");
				const closeBtn   = document.getElementById("export-panel-close");
				const showBtn    = document.getElementById("export-panel-show");
				const mobileToggle = document.getElementById("mobile-panel-toggle");

				// Close right panel
				if (closeBtn && rightPanel) {
					closeBtn.addEventListener("click", function () {
						const isHidden = rightPanel.style.display === "none";
						if (isHidden) {
							rightPanel.style.display = "flex";
						} else {
							rightPanel.style.display = "none";
						}
					});
				}

				// Show button (always hidden in new layout, kept for compat)
				if (showBtn && rightPanel) {
					showBtn.addEventListener("click", function () {
						rightPanel.style.display = "flex";
					});
				}

				// Mobile: toggle right panel
				if (mobileToggle && rightPanel) {
					mobileToggle.addEventListener("click", function () {
						rightPanel.classList.toggle("mobile-open");
					});
				}

				// Handle resize
				window.addEventListener("resize", function () {
					if (window.innerWidth >= 768 && rightPanel) {
						rightPanel.classList.remove("mobile-open");
						rightPanel.style.display = "";
					}
				});
			});
		</script>
